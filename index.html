<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c6f3e8">
<title>Tribeca Eisbestand</title>
<style>
:root{--mint:#c6f3e8;--mint-deep:#a8e4d6;--paper:#fff;--ink:#101010;--muted:#626a67;--line:rgba(16,16,16,.18);--green:#166b52;--red:#a72f2f;--yellow:#fff0a8;--orange:#9a5a15}
*{box-sizing:border-box}
html{background:var(--mint)}
body{margin:0;background:var(--mint);font-family:Avenir,"Avenir Next","Helvetica Neue",Arial,sans-serif;color:var(--ink);letter-spacing:.01em}
button,select,input{font:inherit;color:inherit}
.app{max-width:920px;margin:auto;padding-bottom:140px}
header{position:sticky;top:0;z-index:10;background:rgba(198,243,232,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:18px 18px 14px}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.wordmark{font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;font-weight:900;font-size:25px;line-height:.72;letter-spacing:-1.8px;text-transform:lowercase}
.wordmark span{display:block;font-size:14px;line-height:1;margin-left:18px;letter-spacing:-.7px}
.cloud{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;padding-top:5px}
.tabs{display:flex;gap:4px;overflow:auto;margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.tab{border:0;background:transparent;border-radius:0;padding:9px 18px 8px 0;margin-right:16px;white-space:nowrap;font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;border-bottom:2px solid transparent}
.tab.active{background:transparent;color:var(--ink);border-bottom-color:var(--ink)}
main{padding:18px}
.panel{display:none}.panel.active{display:block}.hidden{display:none!important}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
select,input{width:100%;padding:13px 14px;border:1px solid var(--ink);border-radius:0;background:rgba(255,255,255,.8);font-size:16px}
.admin-lock{display:flex;justify-content:space-between;align-items:center;gap:14px;background:rgba(255,255,255,.86);border:1px solid var(--ink);padding:12px 14px;margin:0 0 12px}
.admin-lock.unlocked{background:#dcefe7;color:#155b47;border-color:#155b47}
.admin-controls{display:flex;align-items:center;gap:8px}.admin-controls input{width:190px;padding:10px 11px;font-size:14px;background:#fff}.admin-controls .btn{padding:10px 12px;white-space:nowrap}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.metric{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:0;padding:15px}
.metric small{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.metric b{display:block;font-size:25px;margin-top:5px}
.completion{border-radius:0;padding:14px;margin:12px 0;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--ink)}
.completion.open{background:#fff1c9;color:#71420d}.completion.done{background:#dcefe7;color:#155b47}
.list{display:grid;gap:7px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 48px 68px 48px;gap:7px;align-items:center;background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:0;padding:8px 9px}
.row.empty-row{margin-top:14px;border-top:2px solid var(--ink);background:rgba(255,255,255,.94)}
.row.locked .step{opacity:.28;cursor:not-allowed}.row.locked .qty{background:#eceeed;color:#6d7471}
.name{font-size:14px;font-weight:650;line-height:1.15}
button{touch-action:manipulation;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}
.step{height:44px;border:1px solid var(--ink);border-radius:0;font-size:23px;font-weight:600}
.minus{background:transparent}.plus{background:var(--ink);color:#fff}
.qty{height:44px;border:1px solid var(--ink);background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(198,243,232,.95);backdrop-filter:blur(14px);border-top:1px solid var(--ink);padding:11px 14px calc(11px + env(safe-area-inset-bottom));z-index:20}
.foot{max-width:920px;margin:auto;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:9px}
.btn{border:1px solid var(--ink);border-radius:0;padding:13px 15px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.save{background:var(--ink);color:#fff}.complete{background:var(--green);border-color:var(--green);color:#fff}.complete.done{background:#dfe9df;color:#557057;border-color:#789087}
.card{background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:0;padding:15px;margin-bottom:11px}
.card h3{font-size:16px;letter-spacing:.08em;text-transform:uppercase}
.hist{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.small{font-size:12px;color:var(--muted)}.ok{color:var(--green)}.err{color:var(--red)}.warn{color:var(--orange)}
.status-pill{display:inline-block;padding:6px 8px;border-radius:0;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.status-pill.done{background:#dcefe7;color:#155b47}.status-pill.open{background:#fff0c9;color:#8b5010}
table{width:100%;border-collapse:collapse}th,td{padding:9px 5px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.stock-table td:nth-child(3),.stock-table td:nth-child(4),.stock-table th:nth-child(3),.stock-table th:nth-child(4){text-align:right}.stock-total td{font-weight:900;border-top:2px solid var(--ink);background:rgba(198,243,232,.42)}
.store-details{margin-top:16px;border-top:2px solid var(--ink)}
.store-details-title{padding:12px 2px 6px;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.store-dropdown{border-bottom:1px solid var(--line)}
.store-dropdown summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px 2px;cursor:pointer}
.store-dropdown summary::-webkit-details-marker{display:none}
.store-dropdown summary::after{content:"+";font-size:24px;font-weight:500;line-height:1}
.store-dropdown[open] summary::after{content:"−"}
.store-dropdown summary b{font-size:14px}
.store-dropdown .store-meta{margin-top:3px;font-size:11px;color:var(--muted)}
.store-stock{padding:0 0 12px}
.store-stock table{background:rgba(255,255,255,.44)}
.store-stock th:nth-child(2),.store-stock th:nth-child(3),.store-stock td:nth-child(2),.store-stock td:nth-child(3){text-align:right}
.store-stock td:first-child{font-weight:650}

@media(max-width:640px){header{padding:15px 13px 12px}.wordmark{font-size:23px}.cloud{max-width:130px;text-align:right;font-size:9px}.tabs{margin-top:15px}.tab{padding-right:12px;margin-right:10px;font-size:11px}main{padding:12px}.summary{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.admin-lock{align-items:stretch;flex-direction:column}.admin-controls{width:100%}.admin-controls input{width:100%;min-width:0}.row{grid-template-columns:minmax(0,1fr) 44px 62px 44px;gap:5px}.foot{grid-template-columns:1fr 1fr}.foot-info{grid-column:1/-1}.btn{padding:12px 8px;font-size:10px}.stock-table th:nth-child(2),.stock-table td:nth-child(2){display:none}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="wordmark">tribeca<span>ice cream</span></div><div id="cloud" class="cloud">Cloud bereit</div></div>
  <div class="tabs">
    <button class="tab active" data-tab="entry">Bestand</button>
    <button class="tab" data-tab="dashboard">Dashboard</button>
    <button class="tab" data-tab="history">Historie</button>
  </div>
</header>
<main>
<section id="entry" class="panel active">
  <div class="toolbar"><select id="store"></select><input id="date" type="date"></div>
  <div id="pastLock" class="admin-lock hidden">
    <div><b id="lockTitle">Vergangener Tag · gesperrt</b><div id="lockText" class="small">Nur Admin kann diesen Bestand ändern.</div></div>
    <div id="adminControls" class="admin-controls"><input id="adminPassword" type="password" placeholder="Admin-Passwort" autocomplete="current-password"><button id="adminUnlock" class="btn">Entsperren</button></div>
  </div>
  <div id="completionState" class="completion open">⚠ Abendinventur noch nicht abgeschlossen</div>
  <div class="summary">
    <div class="metric"><small>Behälter</small><b id="sumContainers">0,0</b></div>
    <div class="metric"><small>kg</small><b id="sumKg">0,0</b></div>
    <div class="metric"><small>Sorten</small><b id="sumFlavors">0</b></div>
  </div>
  <div id="list" class="list"></div>
</section>
<section id="dashboard" class="panel">
  <div class="card"><h3 style="margin-top:0">Abendstatus</h3><div id="completionDashboard"></div></div>
  <div class="card"><h3 style="margin-top:0">Aktueller Bestand nach Standort</h3><div id="dash"></div></div>
  <div class="card"><h3 style="margin-top:0">Niedrige Bestände ≤ 1 Behälter</h3><div id="low"></div></div>
</section>
<section id="history" class="panel">
  <div class="toolbar"><select id="histStore"></select><select id="histFlavor"></select></div>
  <div class="card"><h3 style="margin-top:0">Historie</h3><div id="historyList"></div></div>
</section>
</main>
</div>
<footer id="footer"><div class="foot">
  <div class="foot-info"><b id="footerTotal">0,0 Behälter</b><div class="small">Schritte 0,5 · 1 Behälter = 5,5 kg</div></div>
  <button id="save" class="btn save">Bestand speichern</button>
  <button id="complete" class="btn complete">✓ Abendinventur abschließen</button>
</div></footer>
<script>
const SUPABASE_URL="https://pvnpykkqavomiwofacyz.supabase.co";
const SUPABASE_KEY="sb_publishable_222Ug8p-B-l43VI7pCZN5g_vpTDo7QQ";
const ADMIN_FUNCTION=SUPABASE_URL+"/functions/v1/admin-stock-update";
const FLAVORS=["Almond Orange","Apfel Zimt","Apple Crumble","Banana Pecan","Bienenstich","Black Sesame","Blue Coconut","Cashew Zimt","Cassis Sorbet","Chai Latte","Chocolate Peanut Swirl","Chocolate Whisky","Coconut Cacao Nibs","Crazy Peanut","Double Chocolate Hazelnut","Espresso Hazelnut","Grapefruit Sorbet","Hazelnut","Kalamansi Sorbet","Lemon Poppy Seed","Macadamia","Macadamia Mocca","Mango Passion Fruit","Matcha","Mint Chip","Mocca Brownie","Oat Milk Stracciatella","Peanut Choc Chip","Pecan Pie","Pineapple Sorbet","Pistachio","Pop Orange","Raffaello","Raspberry Basil","Raspberry Coconut","Raw Chocolate","Rum Raisin","Salted Caramell","Salty Maca","Sour Cherry","Strawberry Sorbet","Strawberry White Chocolate","Tiramisu","Tonka White Choc","Vanilla Bean","Walnut Maple","Yellow Peach Sorbet","Yuzu Cheesecake","Zitrone Minze","Zitrone Sorbet","Zitrone Zimt"];
const EMPTY_CONTAINERS="Leere Behälter";
const EXTRA_ITEMS=["Erdbeersosse","Sahne"];
const NON_FLAVOR_ITEMS=[EMPTY_CONTAINERS,...EXTRA_ITEMS];
const ITEMS=[...FLAVORS,...NON_FLAVOR_ITEMS];
const STORES=["Prenzlauer Berg","Kreuzberg","Friedrichshain","Produktion"],MARKER="__INVENTORY_COMPLETE__",STEP=.5,KG=5.5;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function fmt(n){return Number(n||0).toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})}
function todayBerlin(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),v=Object.fromEntries(p.map(x=>[x.type,x.value]));return `${v.year}-${v.month}-${v.day}`}
function isPastDate(){return $('#date').value<todayBerlin()}
function isFutureDate(){return $('#date').value>todayBerlin()}
function headers(extra={}){return{apikey:SUPABASE_KEY,'Content-Type':'application/json',Accept:'application/json',...extra}}
async function api(path,opts={}){const{headers:extraHeaders={},...fetchOpts}=opts;const url=new URL('/rest/v1/'+path,SUPABASE_URL);const r=await fetch(url.toString(),{...fetchOpts,headers:headers(extraHeaders)});const body=await r.text();if(!r.ok)throw new Error(`HTTP ${r.status}: ${body||r.statusText}`);if(!body)return null;try{return JSON.parse(body)}catch{return body}}
async function adminApi(body){const r=await fetch(ADMIN_FUNCTION,{method:'POST',headers:headers(),body:JSON.stringify(body)});let data=null;try{data=await r.json()}catch{}if(!r.ok){if(r.status===401)throw new Error('Admin-Passwort ist falsch.');if(data?.error==='past_dates_only')throw new Error('Nur vergangene Tage können im Admin-Modus geändert werden.');throw new Error('Admin-Freigabe fehlgeschlagen.')}return data||{ok:true}}
STORES.forEach(s=>{$('#store').insertAdjacentHTML('beforeend',`<option>${s}</option>`);$('#histStore').insertAdjacentHTML('beforeend',`<option>${s}</option>`)})
FLAVORS.forEach(f=>$('#histFlavor').insertAdjacentHTML('beforeend',`<option>${f}</option>`));
$('#date').value=todayBerlin();$('#date').max=todayBerlin();
let current=Object.fromEntries(ITEMS.map(f=>[f,0])),completed=false,completedAt=null,dirty=false,adminUnlocked=false,adminPassword='';
function canEdit(){return !isFutureDate()&&(!isPastDate()||adminUnlocked)}
function setCloud(msg,cls=''){$('#cloud').textContent=msg;$('#cloud').className='cloud '+cls}
function setLockUI(){const box=$('#pastLock'),controls=$('#adminControls'),input=$('#adminPassword'),btn=$('#adminUnlock');if(isFutureDate()){box.classList.remove('hidden','unlocked');$('#lockTitle').textContent='Zukünftiger Tag · gesperrt';$('#lockText').textContent='Bestände können erst am jeweiligen Tag erfasst werden.';controls.classList.add('hidden');return}if(!isPastDate()){box.classList.add('hidden');controls.classList.remove('hidden');return}box.classList.remove('hidden');controls.classList.remove('hidden');if(adminUnlocked){box.classList.add('unlocked');$('#lockTitle').textContent='Admin-Modus aktiv';$('#lockText').textContent='Du kannst den vergangenen Bestand jetzt ändern.';input.classList.add('hidden');btn.textContent='Sperren'}else{box.classList.remove('unlocked');$('#lockTitle').textContent='Vergangener Tag · gesperrt';$('#lockText').textContent='Nur Admin kann diesen Bestand ändern.';input.classList.remove('hidden');btn.textContent='Entsperren'}}
function setCompletionUI(){const el=$('#completionState'),btn=$('#complete');if(completed&&!dirty){const t=completedAt?new Date(completedAt).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'';el.className='completion done';el.textContent=`✓ ABENDINVENTUR ABGESCHLOSSEN${t?' · '+t+' Uhr':''}`;btn.className='btn complete done';btn.textContent='✓ Inventur abgeschlossen'}else{el.className='completion open';el.textContent=dirty&&completed?'⚠ Änderungen noch nicht erneut abgeschlossen':'⚠ Abendinventur noch nicht abgeschlossen';btn.className='btn complete';btn.textContent='✓ Abendinventur abschließen'}}
function addRow(list,f,isEmpty=false){const locked=!canEdit(),r=document.createElement('div');r.className='row'+(isEmpty?' empty-row':'')+(locked?' locked':'');r.innerHTML=`<div class=name>${f}</div><button class="step minus" ${locked?'disabled':''}>−</button><div class=qty>${fmt(current[f])}</div><button class="step plus" ${locked?'disabled':''}>+</button>`;r.querySelector('.minus').onclick=()=>{if(!canEdit())return;current[f]=Math.max(0,+(current[f]-STEP).toFixed(1));dirty=true;render()};r.querySelector('.plus').onclick=()=>{if(!canEdit())return;current[f]=+(current[f]+STEP).toFixed(1);dirty=true;render()};list.appendChild(r)}
function render(){setLockUI();const list=$('#list');list.innerHTML='';for(const f of FLAVORS)addRow(list,f);addRow(list,EMPTY_CONTAINERS,true);for(const f of EXTRA_ITEMS)addRow(list,f);const t=FLAVORS.reduce((a,f)=>a+Number(current[f]||0),0);$('#sumContainers').textContent=fmt(t);$('#sumKg').textContent=fmt(t*KG);$('#sumFlavors').textContent=FLAVORS.filter(f=>Number(current[f]||0)>0).length;$('#footerTotal').textContent=fmt(t)+' Behälter';setCompletionUI();$('#save').disabled=!canEdit();$('#complete').disabled=!canEdit()}
async function loadStock(){setCloud('Lade…');current=Object.fromEntries(ITEMS.map(f=>[f,0]));completed=false;completedAt=null;dirty=false;render();try{const s=encodeURIComponent($('#store').value),d=$('#date').value;const rows=await api(`stock_entries?store=eq.${s}&stock_date=eq.${d}&select=flavor,containers,updated_at`);if(Array.isArray(rows)){rows.forEach(x=>{if(x.flavor===MARKER){completed=Number(x.containers)===1;completedAt=x.updated_at}else if(ITEMS.includes(x.flavor)){current[x.flavor]=Number(x.containers)}});render()}setCloud(isPastDate()&&!adminUnlocked?'Vergangener Bestand gesperrt':'Cloud verbunden',isPastDate()&&!adminUnlocked?'warn':'ok')}catch(e){setCloud('Cloud-Fehler','err');console.error(e)}}
async function persistStock(markOpen=false){const payload=ITEMS.map(f=>({store:$('#store').value,stock_date:$('#date').value,flavor:f,containers:Number(current[f]||0),updated_at:new Date().toISOString()}));if(markOpen)payload.push({store:$('#store').value,stock_date:$('#date').value,flavor:MARKER,containers:0,updated_at:new Date().toISOString()});await api('stock_entries?on_conflict=store,stock_date,flavor',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(payload)})}
async function writeInventory(done){const store=$('#store').value,date=$('#date').value;if(isFutureDate())throw new Error('Zukünftige Bestände können nicht gespeichert werden.');if(isPastDate()){if(!adminUnlocked||!adminPassword)throw new Error('Dieser Tag ist gesperrt. Bitte zuerst als Admin entsperren.');return adminApi({mode:'save',password:adminPassword,store,stock_date:date,items:ITEMS.map(f=>({flavor:f,containers:Number(current[f]||0)})),completed:done})}if(!done){await persistStock(true);return{updated_at:null}}await persistStock(false);const now=new Date().toISOString();await api('stock_entries?on_conflict=store,stock_date,flavor',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify([{store,stock_date:date,flavor:MARKER,containers:1,updated_at:now}])});return{updated_at:now}}
$('#adminUnlock').onclick=async()=>{if(adminUnlocked){adminUnlocked=false;adminPassword='';$('#adminPassword').value='';render();setCloud('Admin-Modus beendet');return}const password=$('#adminPassword').value;if(!password){alert('Bitte Admin-Passwort eingeben.');return}try{setCloud('Prüfe Admin…');$('#adminUnlock').disabled=true;await adminApi({mode:'verify',password});adminPassword=password;adminUnlocked=true;render();setCloud('✓ Admin-Modus aktiv','ok')}catch(e){adminUnlocked=false;adminPassword='';$('#adminPassword').value='';render();setCloud('Admin-Passwort falsch','err');alert(e.message)}$('#adminUnlock').disabled=false};
$('#adminPassword').addEventListener('keydown',e=>{if(e.key==='Enter')$('#adminUnlock').click()});
$('#save').onclick=async()=>{if(!canEdit())return;try{setCloud('Speichere…');$('#save').disabled=true;await writeInventory(false);completed=false;completedAt=null;dirty=false;render();setCloud(isPastDate()?'✓ Vergangener Bestand geändert':'✓ Bestand gespeichert · Inventur noch offen','ok')}catch(e){if(e.message.includes('Passwort')){adminUnlocked=false;adminPassword='';render()}setCloud('Speichern fehlgeschlagen','err');alert('Speichern fehlgeschlagen:\n\n'+e.message);console.error(e)}$('#save').disabled=!canEdit()};
$('#complete').onclick=async()=>{if(!canEdit())return;const total=FLAVORS.reduce((a,f)=>a+Number(current[f]||0),0),active=FLAVORS.filter(f=>Number(current[f]||0)>0).length;const store=$('#store').value,date=$('#date').value;if(!confirm(`Inventur wirklich abschließen?\n\n${store} · ${date}\n${active} Sorten vorhanden · ${fmt(total)} Behälter\n\nDanach gilt die Abendinventur als vollständig.`))return;try{setCloud('Schließe ab…');$('#complete').disabled=true;const result=await writeInventory(true),now=result?.updated_at||new Date().toISOString();completed=true;completedAt=now;dirty=false;render();setCloud(isPastDate()?'✓ Vergangene Inventur geändert und abgeschlossen':'✓ Abendinventur abgeschlossen','ok')}catch(e){if(e.message.includes('Passwort')){adminUnlocked=false;adminPassword='';render()}setCloud('Abschluss fehlgeschlagen','err');alert('Abschluss fehlgeschlagen:\n\n'+e.message);console.error(e)}$('#complete').disabled=!canEdit()};
$('#store').onchange=loadStock;$('#date').onchange=loadStock;
async function dashboard(){try{const rows=await api('stock_entries?select=store,stock_date,flavor,containers,updated_at&order=stock_date.desc');const latest={};for(const r of rows){if(!latest[r.store])latest[r.store]=r.stock_date}let ch='',low=[],storeRows=[],storeDetails=[],grandTotal=0;for(const s of STORES){const d=latest[s],rs=rows.filter(r=>r.store===s&&r.stock_date===d),marker=rs.find(r=>r.flavor===MARKER),stock=rs.filter(r=>r.flavor!==MARKER&&!NON_FLAVOR_ITEMS.includes(r.flavor)),present=stock.filter(r=>Number(r.containers)>0).sort((a,b)=>a.flavor.localeCompare(b.flavor,'de')),total=stock.reduce((a,b)=>a+Number(b.containers),0),done=marker&&Number(marker.containers)===1;grandTotal+=total;let tm=done&&marker.updated_at?new Date(marker.updated_at).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'';ch+=`<div class=hist><div><b>${s}</b><div class=small>${d||'kein Bestand'}</div></div><div><span class="status-pill ${done?'done':'open'}">${done?'✓ abgeschlossen'+(tm?' · '+tm:''):'⚠ noch offen'}</span></div></div>`;storeRows.push(`<tr><td><b>${s}</b></td><td>${d||'–'}</td><td><b>${fmt(total)}</b></td><td>${fmt(total*KG)}</td></tr>`);storeDetails.push(`<details class="store-dropdown"><summary><div><b>${s}</b><div class="store-meta">${d||'kein Bestand'} · ${present.length} Sorten · ${fmt(total)} Behälter</div></div></summary><div class="store-stock">${present.length?`<table><tr><th>Sorte</th><th>Behälter</th><th>kg</th></tr>${present.map(r=>`<tr><td>${r.flavor}</td><td><b>${fmt(r.containers)}</b></td><td>${fmt(Number(r.containers)*KG)}</td></tr>`).join('')}</table>`:'<div class="small">Keine Sorten mit Bestand.</div>'}</div></details>`);stock.filter(r=>Number(r.containers)<=1).forEach(r=>low.push(r))}$('#completionDashboard').innerHTML=ch;$('#dash').innerHTML=`<table class="stock-table"><tr><th>Standort</th><th>Bestandsdatum</th><th>Behälter</th><th>kg</th></tr>${storeRows.join('')}<tr class="stock-total"><td>Gesamt</td><td></td><td>${fmt(grandTotal)}</td><td>${fmt(grandTotal*KG)}</td></tr></table><div class="store-details"><div class="store-details-title">Sorten je Standort</div>${storeDetails.join('')}</div>`;low.sort((a,b)=>Number(a.containers)-Number(b.containers));$('#low').innerHTML=low.length?`<table><tr><th>Sorte</th><th>Laden</th><th>Bestand</th></tr>${low.slice(0,40).map(r=>`<tr><td>${r.flavor}</td><td>${r.store}</td><td><b>${fmt(r.containers)}</b></td></tr>`).join('')}</table>`:'<div class=small>Keine Daten</div>'}catch(e){$('#dash').innerHTML='<div class="err">Datenbankfehler.</div>';console.error(e)}}
async function history(){try{const s=encodeURIComponent($('#histStore').value),f=encodeURIComponent($('#histFlavor').value);const rows=await api(`stock_entries?store=eq.${s}&flavor=eq.${f}&select=stock_date,containers&order=stock_date.desc&limit=90`);$('#historyList').innerHTML=rows.length?rows.map(r=>`<div class=hist><b>${r.stock_date}</b><div><b>${fmt(r.containers)}</b> Beh.<div class=small>${fmt(r.containers*KG)} kg</div></div></div>`).join(''):'<div class=small>Keine Daten</div>'}catch(e){$('#historyList').innerHTML='<div class="err">Datenbankfehler.</div>';console.error(e)}}
$('#histStore').onchange=history;$('#histFlavor').onchange=history;
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');$$('.panel').forEach(x=>x.classList.remove('active'));$('#'+b.dataset.tab).classList.add('active');$('#footer').style.display=b.dataset.tab==='entry'?'block':'none';if(b.dataset.tab==='dashboard')dashboard();if(b.dataset.tab==='history')history()});
render();loadStock();
</script>
</body></html>
