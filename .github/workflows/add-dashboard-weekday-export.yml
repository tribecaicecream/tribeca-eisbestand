name: Add dashboard weekday and Excel export
on:
  push:
    paths:
      - '.tmp/dashboard-export.trigger'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update production dashboard
        run: python3 .tmp/dashboard-export.py
      - name: Commit dashboard changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production.html
          git rm .tmp/dashboard-export.trigger
          git rm .tmp/dashboard-export.py
          git rm .github/workflows/add-dashboard-weekday-export.yml
          git commit -m "Add weekday and Excel export to dashboard"
          git push
