name: Set production history default 2026

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/set-production-history-default-2026.yml'

permissions:
  contents: write

jobs:
  update-default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set 2026 as default range
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('production.html')
          s = p.read_text()
          old = '''        <option value="all" selected>Gesamter Zeitraum</option>\n        <option value="year-2026">Gesamt 2026</option>'''
          new = '''        <option value="all">Gesamter Zeitraum</option>\n        <option value="year-2026" selected>Gesamt 2026</option>'''
          if old not in s:
              raise SystemExit('Expected production history select options not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production.html
          git diff --cached --quiet || git commit -m "Default production history to 2026"
          git push
