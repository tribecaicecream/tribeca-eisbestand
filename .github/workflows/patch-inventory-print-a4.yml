name: Patch inventory print A4

on:
  push:
    paths:
      - '.github/workflows/patch-inventory-print-a4.yml'
      - 'scripts/patch_inventory_print_a4.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch inventory print layout
        run: python3 scripts/patch_inventory_print_a4.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Fit inventory print view on one A4 page"
          git push
