name: Patch dashboard 2025

on:
  push:
    paths:
      - '.github/workflows/patch-dashboard-2025.yml'
      - 'scripts/patch_dashboard_2025.py'
      - '.tmp/dashboard-2025.trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production dashboard
        run: python3 scripts/patch_dashboard_2025.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add 2025 revenue periods to dashboard"
          git push
