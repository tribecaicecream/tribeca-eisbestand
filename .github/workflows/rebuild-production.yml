name: Rebuild production dashboard
on:
  push:
    paths:
      - '.tmp/rebuild-production.trigger'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild production.html
        run: |
          cat .tmp/production_b64_1.txt .tmp/production_b64_2.txt .tmp/production_b64_3.txt .tmp/production_b64_4.txt | base64 -d > production.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production.html
          git rm -r .tmp
          git rm .github/workflows/rebuild-production.yml
          git commit -m "Add selectable Orderbird metrics to dashboard"
          git push
