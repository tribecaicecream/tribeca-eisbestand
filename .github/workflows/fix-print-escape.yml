name: Fix inventory print escaping

on:
  push:
    paths:
      - '.github/workflows/fix-print-escape.yml'
      - 'scripts/fix_print_escape.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix print escaping
        run: python3 scripts/fix_print_escape.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Fix dedicated print page escaping"
          git push
