name: Patch dedicated inventory print page

on:
  push:
    paths:
      - '.github/workflows/patch-dedicated-print-page.yml'
      - 'scripts/patch_dedicated_print_page.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dedicated print page
        run: python3 scripts/patch_dedicated_print_page.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Use dedicated A4 portrait inventory print page"
          git push
