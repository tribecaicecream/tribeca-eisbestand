name: Update dashboard layout
on:
  push:
    paths:
      - '.tmp/dashboard-layout.trigger'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update production dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('production.html')
          s = path.read_text(encoding='utf-8')

          # Layout: only one KPI/metric result at a time.
          s = s.replace('.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}', '.kpi-grid{display:grid;grid-template-columns:1fr;gap:10px}')
          s = s.replace('.breakdown-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px', '.breakdown-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px')

          # Time filter: full year, last 7 days, or calendar month.
          range_html = '''<select id="analyticsRange">
        <option value="year" selected>Gesamt 2026</option>
        <option value="7">Letzte 7 Tage</option>
        <option value="month-01">Januar</option>
        <option value="month-02">Februar</option>
        <option value="month-03">März</option>
        <option value="month-04">April</option>
        <option value="month-05">Mai</option>
        <option value="month-06">Juni</option>
        <option value="month-07">Juli</option>
        <option value="month-08">August</option>
        <option value="month-09">September</option>
        <option value="month-10">Oktober</option>
        <option value="month-11">November</option>
        <option value="month-12">Dezember</option>
      </select>'''
          s, n = re.subn(r'<select id="analyticsRange">.*?</select>', range_html, s, count=1, flags=re.S)
          assert n == 1, 'analyticsRange block not found'

          # Metric dropdown: exact groups requested by the user; Gross turnover is always the initial selection.
          metric_html = '''<select id="metricSelect">
          <optgroup label="Umsatz">
            <option value="gross_turnover" selected>Gross turnover</option>
            <option value="net_turnover">Net turnover</option>
            <option value="collected_tips">Collected tips</option>
          </optgroup>
          <optgroup label="Drinks">
            <option value="category_drinks">Kategorie: Drinks</option>
            <option value="americano">Americano</option>
            <option value="bier">Bier</option>
            <option value="coconut">Coconut</option>
            <option value="doppelter_espresso">Doppelter Espresso</option>
            <option value="iced_coffee">Iced Coffee</option>
            <option value="iced_latte">Iced Latte</option>
            <option value="kombucha">Kombucha</option>
            <option value="mono_tea">Mono Tea</option>
            <option value="something_nothing">Something+nothing</option>
            <option value="wasser">Wasser</option>
            <option value="wasser_sprudel">Wasser Sprudel</option>
          </optgroup>
          <optgroup label="Eis">
            <option value="category_eis">Kategorie: Eis</option>
            <option value="scoop_1">1</option>
            <option value="scoop_2">2</option>
            <option value="scoop_3">3</option>
            <option value="affogato">Affogato</option>
            <option value="bunte_waffel">Bunte waffel</option>
            <option value="free_scoop">Free Scoop</option>
            <option value="glutenfreie_waffel">Glutenfreie Waffel</option>
            <option value="home_made_cone">Home made Cone</option>
            <option value="kids">Kids</option>
            <option value="sahne">Sahne</option>
            <option value="sauce_caramel">Sauce Caramel</option>
            <option value="sauce_erdbeer">Sauce Erdbeer</option>
            <option value="sauce_haselnuss">Sauce Haselnuss</option>
            <option value="sauce_mandel">Sauce Mandel</option>
            <option value="sauce_pistazie">Sauce Pistazie</option>
            <option value="sauce_choco">Sauce choco</option>
            <option value="spaghetti_ice_cream">Spaghetti Ice Cream</option>
            <option value="sundae">Sundae</option>
            <option value="toppings">Toppings</option>
          </optgroup>
          <optgroup label="Gutscheine">
            <option value="category_gutscheine">Kategorie: Gutscheine</option>
            <option value="gutschein_10_kugeln">Gutschein 10 Kugeln</option>
          </optgroup>
          <optgroup label="Mitarbeiter">
            <option value="category_mitarbeiter">Kategorie: Mitarbeiter</option>
          </optgroup>
          <optgroup label="Pints">
            <option value="category_pints">Kategorie: Pints</option>
            <option value="ipa_bier">IPA Bier</option>
          </optgroup>
          <optgroup label="Shirts">
            <option value="category_shirts">Kategorie: Shirts</option>
          </optgroup>
        </select>'''
          s, n = re.subn(r'<select id="metricSelect">.*?</select>', metric_html, s, count=1, flags=re.S)
          assert n == 1, 'metricSelect block not found'
          s = s.replace('<label for="metricSelect">Weitere Auswertung</label>', '<label for="metricSelect">Kennzahl</label>')

          # Remove the permanently displayed Net turnover KPI. Keep one KPI for the selected metric.
          kpi_html = '''<div class="kpi-grid">
        <div class="kpi"><small id="selectedMetricLabel">Gross turnover</small><b id="selectedMetricKpi">–</b><div id="selectedMetricMeta" class="small"></div></div>
      </div>'''
          s, n = re.subn(r'<div class="kpi-grid">\s*<div class="kpi"><small>Nettoumsatz</small>.*?</div>\s*<div class="kpi"><small id="selectedMetricLabel">.*?</div>\s*</div>', kpi_html, s, count=1, flags=re.S)
          assert n == 1, 'KPI block not found'

          # Remove the separate Net turnover daily chart.
          s = re.sub(r'\s*<div class="chart-title">Nettoumsatz · letzte Tage im Zeitraum</div>\s*<div id="revenueChart" class="bar-chart"></div>', '', s, count=1)
          s = s.replace('Gross turnover · letzte Tage im Zeitraum', 'Gross turnover · einzelne Tage')

          # Data state: selected metrics alone drive the dashboard.
          s = s.replace('let revenueRows=[],metricRows=[],analyticsLoaded=false;', 'let metricRows=[],analyticsLoaded=false;')

          # Replace date filtering. "Last 7 days" is relative to the newest available report date.
          filter_js = '''function latestMetricDate(){
  const dates=metricRows.map(r=>r.metric_date).filter(Boolean).sort();
  return dates.length?dates[dates.length-1]:null;
}
function analyticsFilter(rows,dateField){
  const store=$('#analyticsStore').value,range=$('#analyticsRange').value,latest=latestMetricDate();
  let sevenStart=null;
  if(range==='7'&&latest){
    const d=new Date(latest+'T12:00:00');d.setDate(d.getDate()-6);sevenStart=localDateISO(d);
  }
  return rows.filter(r=>{
    if(store!=='all'&&r.store!==store)return false;
    const d=String(r[dateField]||'');
    if(range==='year')return d.startsWith('2026-');
    if(range==='7')return !!latest&&d>=sevenStart&&d<=latest;
    if(range.startsWith('month-'))return d.startsWith('2026-'+range.slice(6));
    return true;
  });
}'''
          s, n = re.subn(r'function analyticsStartDate\(\)\{.*?\n\}\nfunction analyticsFilter\(rows,dateField\)\{.*?\n\}', filter_js, s, count=1, flags=re.S)
          assert n == 1, 'analytics date filter functions not found'

          # Newest daily value first, and show every day in the selected period.
          s = s.replace('const el=$(target);const recent=series.slice(-21);const max=Math.max(0,...recent.map(([,v])=>v));', 'const el=$(target);const recent=series.slice().reverse();const max=Math.max(0,...recent.map(([,v])=>v));')

          render_js = '''function renderAnalytics(){
  if(!analyticsLoaded)return;
  const key=$('#metricSelect').value,metric=METRICS[key]||METRICS.gross_turnover,formatMetric=metricFormatter(metric);
  const selectedRows=analyticsFilter(metricRows,'metric_date');
  const selectedTotal=selectedRows.reduce((a,r)=>a+metricValue(r,key),0);
  const dates=[...new Set(selectedRows.map(r=>r.metric_date))].sort();
  const periodLabel=$('#analyticsRange').selectedOptions[0]?.textContent||'';
  $('#selectedMetricLabel').textContent=metric.label;
  $('#selectedMetricKpi').textContent=formatMetric(selectedTotal);
  $('#selectedMetricMeta').textContent=dates.length?`${periodLabel} · ${dates.length} Berichtstage · ${displayDate(dates[0])} – ${displayDate(dates[dates.length-1])}`:`${periodLabel} · keine Daten`;
  const stores=$('#analyticsStore').value==='all'?['Friedrichshain','Prenzlauer Berg','Kreuzberg']:[$('#analyticsStore').value];
  $('#storeBreakdown').innerHTML=stores.map(store=>{
    const value=selectedRows.filter(x=>x.store===store).reduce((a,x)=>a+metricValue(x,key),0);
    return `<div class="breakdown-row"><span>${storeLabel(store)}</span><b>${formatMetric(value)}</b></div>`;
  }).join('');
  $('#metricChartTitle').textContent=`${metric.label} · einzelne Tage`;
  renderBars('#metricChart',groupByDate(selectedRows,'metric_date',r=>metricValue(r,key)),formatMetric,'sauce');
}'''
          s, n = re.subn(r'function renderAnalytics\(\)\{.*?\n\}\nasync function loadAnalytics', render_js+'\nasync function loadAnalytics', s, count=1, flags=re.S)
          assert n == 1, 'renderAnalytics function not found'

          load_js = '''async function loadAnalytics(){
  $('#analyticsStatus').textContent='Lade Umsatzdaten …';$('#analyticsStatus').className='small';$('#analyticsContent').style.display='none';
  try{
    const metricData=await api('daily_orderbird_metrics?select=metric_date,store,metrics&order=metric_date.asc');
    metricRows=Array.isArray(metricData)?metricData:[];
    analyticsLoaded=true;$('#analyticsStatus').textContent='';$('#analyticsContent').style.display='block';renderAnalytics();
  }catch(e){analyticsLoaded=false;$('#analyticsStatus').className='err';$('#analyticsStatus').textContent='Umsatzdaten konnten nicht geladen werden.';console.error(e)}
}'''
          s, n = re.subn(r'async function loadAnalytics\(\)\{.*?\n\}\n\$\(\x27#analyticsRange\x27\)', load_js+"\n$('#analyticsRange')", s, count=1, flags=re.S)
          assert n == 1, 'loadAnalytics function not found'

          # Ensure Gross turnover is the initial metric each time the page is freshly loaded.
          s = s.replace("$('#date').value=localDateISO();", "$('#date').value=localDateISO();\n$('#metricSelect').value='gross_turnover';")

          path.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production.html
          git rm .tmp/dashboard-layout.trigger
          git rm .github/workflows/update-dashboard-layout.yml
          git commit -m "Simplify dashboard metric and period filters"
          git push
