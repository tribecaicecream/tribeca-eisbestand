name: Update dashboard layout
on:
  push:
    paths:
      - '.tmp/dashboard-layout.trigger'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard
        run: python3 .tmp/patch_dashboard.py
      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production.html
          git rm .tmp/dashboard-layout.trigger
          git rm .tmp/patch_dashboard.py
          git rm .github/workflows/update-dashboard-layout.yml
          git commit -m "Simplify dashboard metric and period filters"
          git push
