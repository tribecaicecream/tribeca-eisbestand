name: Patch analytics pagination
on:
  push:
    paths:
      - '.github/workflows/patch-analytics-pagination.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python scripts/patch_analytics_pagination.py
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production.html
          git diff --cached --quiet || git commit -m "Fix revenue dashboard pagination"
          git push origin main
