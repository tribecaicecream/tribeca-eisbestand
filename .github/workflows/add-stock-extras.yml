name: Add stock extras

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-stock-extras.yml'

permissions:
  contents: write

jobs:
  update-stock-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Erdbeersosse and Sahne stock fields
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          replacements = [
            (
              'const EMPTY_CONTAINERS="Leere Behälter";\nconst ITEMS=[...FLAVORS,EMPTY_CONTAINERS];',
              'const EMPTY_CONTAINERS="Leere Behälter";\nconst EXTRA_ITEMS=["Erdbeersosse","Sahne"];\nconst NON_FLAVOR_ITEMS=[EMPTY_CONTAINERS,...EXTRA_ITEMS];\nconst ITEMS=[...FLAVORS,...NON_FLAVOR_ITEMS];'
            ),
            (
              "function render(){setLockUI();const list=$('#list');list.innerHTML='';for(const f of FLAVORS)addRow(list,f);addRow(list,EMPTY_CONTAINERS,true);const t=FLAVORS.reduce((a,f)=>a+Number(current[f]||0),0);",
              "function render(){setLockUI();const list=$('#list');list.innerHTML='';for(const f of FLAVORS)addRow(list,f);addRow(list,EMPTY_CONTAINERS,true);for(const f of EXTRA_ITEMS)addRow(list,f);const t=FLAVORS.reduce((a,f)=>a+Number(current[f]||0),0);"
            ),
            (
              "stock=rs.filter(r=>r.flavor!==MARKER&&r.flavor!==EMPTY_CONTAINERS)",
              "stock=rs.filter(r=>r.flavor!==MARKER&&!NON_FLAVOR_ITEMS.includes(r.flavor))"
            ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected text not found: {old[:80]}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add Erdbeersosse and Sahne stock fields"
          git push
