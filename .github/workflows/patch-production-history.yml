name: Patch production history dashboard

on:
  push:
    paths:
      - '.github/workflows/patch-production-history.yml'
      - 'scripts/patch_production_history_dashboard.py'
      - '.tmp/production-history.trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production history dashboard
        run: python3 scripts/patch_production_history_dashboard.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add production history dashboard"
          git push
