name: Patch CSV export
on:
  push:
    paths:
      - '.tmp/csv-export.trigger'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard export
        run: python3 scripts/patch_csv_export.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production.html
          git rm .tmp/csv-export.trigger
          git rm scripts/patch_csv_export.py
          git rm .github/workflows/patch-csv-export.yml
          git commit -m "Replace Excel export with CSV export"
          git push
