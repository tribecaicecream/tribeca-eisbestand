name: Fix dashboard markup
on:
  push:
    paths:
      - '.tmp/fix-dashboard-markup.trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .tmp/fix-dashboard-markup.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production.html
          git rm .tmp/fix-dashboard-markup.py
          git rm .tmp/fix-dashboard-markup.trigger
          git rm .github/workflows/fix-dashboard-markup.yml
          git commit -m "Clean dashboard markup"
          git push
